name: CI/CD Pipeline - Test & Deploy to Heroku

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # ========================================================
  ci:
    name: 🧪 CI - Lint & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, json, curl
          coverage: none

      - name: 📋 Validate composer.json
        run: composer validate --strict

      - name: 🔍 PHP Syntax Check (Linting)
        run: |
          echo "Kiểm tra lỗi cú pháp PHP..."
          find . -type f -name "*.php" ! -path "*/vendor/*" -exec php -l {} +

      - name: 🗄️ Run Smoke Test Suite
        run: php tests/smoke_test.php

  # ========================================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # ========================================================
  cd:
    name: 🚀 CD - Deploy to Heroku
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Deploy to Heroku
        id: deploy
        env:
          SECRET_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          VAR_API_KEY: ${{ vars.HEROKU_API_KEY }}
          SECRET_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          VAR_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
        run: |
          RAW_KEY="${SECRET_API_KEY:-$VAR_API_KEY}"
          RAW_APP="${SECRET_APP_NAME:-$VAR_APP_NAME}"

          # Tự động loại bỏ dấu ngoặc kép, khoảng trắng thừa hoặc ký tự xuống dòng
          HEROKU_API_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n"' | xargs)
          HEROKU_APP_NAME=$(echo -n "$RAW_APP" | tr -d '\r\n"' | xargs)

          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error title=Thiếu HEROKU_API_KEY::Không tìm thấy HEROKU_API_KEY trong GitHub Secrets!"
            exit 1
          fi

          if [ -z "$HEROKU_APP_NAME" ]; then
            echo "::error title=Thiếu HEROKU_APP_NAME::Không tìm thấy HEROKU_APP_NAME trong GitHub Secrets hoặc Variables!"
            exit 1
          fi

          echo "🎯 Heroku App Name: $HEROKU_APP_NAME"
          echo "🔑 Độ dài Token nhận được: ${#HEROKU_API_KEY} ký tự"
          echo "🔑 Tiền tố Token: ${HEROKU_API_KEY:0:5}..."

          echo "🔍 Đang xác thực với Heroku API..."

          HTTP_STATUS=$(curl -s -o heroku_api_check.json -w "%{http_code}" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME")

          echo "Mã phản hồi từ Heroku API: $HTTP_STATUS"
          echo "Nội dung phản hồi từ Heroku API:"
          cat heroku_api_check.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERROR_MSG=$(cat heroku_api_check.json)
            echo "::error title=Lỗi Heroku API ($HTTP_STATUS)::$ERROR_MSG"
            exit 1
          fi

          WEB_URL=$(jq -r '.web_url' heroku_api_check.json)
          echo "web_url=$WEB_URL" >> $GITHUB_OUTPUT
          echo "✅ Xác thực thành công! URL Website: $WEB_URL"

          # Cấu hình git & netrc
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat << EOF > ~/.netrc
          machine api.heroku.com
            login _
            password $HEROKU_API_KEY
          machine git.heroku.com
            login _
            password $HEROKU_API_KEY
          EOF
          chmod 600 ~/.netrc

          # Add Remote Heroku và Push code
          git remote add heroku "https://git.heroku.com/${HEROKU_APP_NAME}.git"

          echo "🚀 Đang build và deploy lên Heroku..."
          PUSH_LOG=$(git push heroku HEAD:main --force 2>&1)
          PUSH_EXIT=$?

          if [ $PUSH_EXIT -ne 0 ]; then
            echo "Thử lại với nhánh master..."
            PUSH_LOG=$(git push heroku HEAD:master --force 2>&1)
            PUSH_EXIT=$?
          fi

          echo "$PUSH_LOG"

          if [ $PUSH_EXIT -ne 0 ]; then
            echo "::error title=Lỗi Git Push Heroku::$PUSH_LOG"
            exit $PUSH_EXIT
          fi

          echo "🎉 Đã deploy thành công lên Heroku!"

      - name: 🩺 Smoke Test / Health Check Live Site
        env:
          LIVE_URL: ${{ steps.deploy.outputs.web_url }}
        run: |
          echo "Đang đợi Heroku Dyno khởi động tại $LIVE_URL ..."
          sleep 12
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$LIVE_URL")
          echo "Health Check Response Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "🎉 Website ALICE Cosmetic đã online tại: $LIVE_URL"
          else
            echo "⚠️ Phản hồi HTTP $HTTP_STATUS từ Heroku."
          fi
